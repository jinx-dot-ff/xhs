<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>笔记详情 · 评里找交互原型</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="note">
  <div class="phone-frame">
  <main class="app note-app"><header class="note-header"><div class="statusbar"><span>9:41</span><div><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></div></div><div class="note-top"><a class="icon-button" href="index.html" aria-label="返回首页" data-action="back-home"><i data-lucide="chevron-left"></i></a><div id="note-author" class="note-author"></div><button class="follow-button" data-action="follow" aria-pressed="false">关注</button><button class="icon-button" aria-label="分享笔记" data-action="share"><svg class="share-arrow" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 26c0-9.5 4.8-15.5 14-15.5V4l12 10.5L17 25v-7c-6.4 0-10.3 2.5-14 8Z"/></svg></button></div></header>
    <section id="note-photo" class="note-photo" aria-label="笔记图片"></section><article id="note-body" class="note-body"></article>
    <section id="comments-section" class="comments-section" aria-label="笔记评论"><div class="comment-heading"><h2 id="comment-count"></h2></div><div id="inline-comment-entry" class="inline-comment-entry"><span id="comment-self-avatar"></span><button class="inline-comment-placeholder" data-action="compose" aria-label="发表评论"><span>爱评论的人运气都不差</span><i data-lucide="mic" aria-hidden="true"></i><i data-lucide="image" aria-hidden="true"></i></button><button id="search-entry" class="search-entry" data-action="open-search" aria-label="搜评论" aria-expanded="false" aria-controls="comment-search"><i data-lucide="search" aria-hidden="true"></i></button></div><div id="comment-search" class="comment-search" hidden><div class="query-row"><span id="search-author-avatar" aria-label="笔记作者头像"></span><div class="query-input"><button class="query-submit" data-action="search" aria-label="搜索评论"><i data-lucide="search" aria-hidden="true"></i></button><input id="query" type="text" aria-label="输入关键词或一句话描述" placeholder="关键词，或一句话描述" autocomplete="off" enterkeyhint="search"><button class="query-clear" data-action="clear-query" aria-label="清空搜索" hidden><i data-lucide="x"></i></button><button class="query-voice" data-action="voice-search" aria-label="语音输入"><i data-lucide="mic" aria-hidden="true"></i></button></div><button class="query-cancel" data-action="exit-search">取消</button></div><div class="search-modes" role="group" aria-label="搜索方式"><button data-mode="ai" class="active" aria-pressed="true"><i data-lucide="sparkles"></i>相关评论</button><button data-mode="keyword" aria-pressed="false">包含关键词</button></div></div><div id="search-state" aria-live="polite"></div><div id="comment-list"></div></section>
    <footer class="note-action-bar"><button class="comment-placeholder" data-action="compose"><i data-lucide="pencil-line"></i><span>说点什么…</span></button><button class="metric-action" data-action="note-like" aria-label="点赞笔记" aria-pressed="false"><i data-lucide="heart"></i><span id="note-likes"></span></button><button class="metric-action" data-action="note-save" aria-label="收藏笔记" aria-pressed="false"><i data-lucide="star"></i><span id="note-saves"></span></button><button class="metric-action" data-action="jump-comments" aria-label="查看评论"><i data-lucide="message-circle"></i><span id="bottom-comment-count"></span></button></footer>
  </main>
  <div id="toast" role="status" aria-live="polite" hidden></div><div id="sheet-root"></div>
  </div>
  <script src="assets/lucide.js"></script><script src="data.js"></script><script src="search.js"></script><script src="app.js"></script>
</body></html>
